spring:
  application:
    name: order-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${POSTGRES_USER:matchday}
    password: ${POSTGRES_PASSWORD:matchday}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  # Latency buckets, so Grafana can compute p95 per endpoint
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

jwt:
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}

matchday:
  ticket-service:
    url: ${TICKET_SERVICE_URL:http://localhost:8081}
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8080}
  outbox:
    relay-interval: ${OUTBOX_RELAY_INTERVAL:1s}
  