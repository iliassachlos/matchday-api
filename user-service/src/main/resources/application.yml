spring:
  application:
    name: user-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/userdb}
    username: ${POSTGRES_USER:matchday}
    password: ${POSTGRES_PASSWORD:matchday} 

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration 

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: always

jwt:
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/jwt-private.pem}
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}
