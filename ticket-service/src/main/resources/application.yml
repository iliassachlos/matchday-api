spring:
  application:
    name: ticket-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketdb}
    username: ${POSTGRES_USER:matchday}
    password: ${POSTGRES_PASSWORD:matchday}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ticket-service
      auto-offset-reset: earliest



server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt: 
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}

matchday:
  hold:
    duration: ${HOLD_DURATION:10m}
    release-interval: ${HOLD_RELEASE_INTERVAL:30s}

  mail:
    from: ${MAIL_FROM:tickets@matchday.local}

  tickets:
    signing-secret: ${TICKET_SIGNING_SECRET:local-dev-ticket-signing-secret}
