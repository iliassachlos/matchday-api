spring:
  application:
    name: ticket-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketdb}
    username: ${POSTGRES_USER:matchday}
    password: ${POSTGRES_PASSWORD:matchday}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

jwt: 
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}

matchday:
  hold:
    duration: ${HOLD_DURATION:10m}
    release-interval: ${HOLD_RELEASE_INTERVAL:30s}
