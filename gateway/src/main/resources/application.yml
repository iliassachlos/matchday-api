spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/**

            - id: ticket-service
              uri: ${TICKET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/events/**,/api/v1/seats/**,/api/v1/tickets/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders/**

server:
  port: ${SERVER_PORT:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
